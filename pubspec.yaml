  flutter_pdfview: ^1.2.1
  image_picker: ^1.1.2
#  file_picker: ^6.2.1
  open_file: ^3.5.4
  google_mlkit_face_detection: ^0.12.0
  flutter_face_api: ^7.1.267



dev_dependencies:
  flutter_test:

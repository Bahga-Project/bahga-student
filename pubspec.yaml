name: bahga_student
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <=3.8.1"

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Firebase (Updated Versions)
  firebase_core: ^2.30.0
  firebase_auth: ^4.17.6
  firebase_messaging: ^14.7.21
  firebase_storage: ^11.7.5
  cloud_firestore: ^4.15.7
  google_fonts: ^6.2.1
  video_player: ^2.7.0
